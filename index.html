<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Primary Meta Tags -->
    <title>ETF 시세 조회 - 실시간 ETF 가격 및 일별 시세 정보</title>
    <meta name="title" content="ETF 시세 조회 - 실시간 ETF 가격 및 일별 시세 정보">
    <meta name="description" content="KODEX 200, TIGER 200 등 ETF 종목의 시간대별/일별 시세를 한눈에 확인하세요. 현재가, 등락률, 거래량 정보를 제공합니다.">
    <meta name="keywords" content="ETF, 시세, 주식, KODEX, TIGER, 투자, 금융, 상장지수펀드">
    <meta name="author" content="embrain82">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://251113-01.vercel.app/">
    <meta property="og:title" content="ETF 시세 조회">
    <meta property="og:description" content="ETF 종목의 시간대별/일별 시세를 한눈에 확인하세요">
    <meta property="og:image" content="https://251113-01.vercel.app/og-image.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://251113-01.vercel.app/">
    <meta property="twitter:title" content="ETF 시세 조회">
    <meta property="twitter:description" content="ETF 종목의 시간대별/일별 시세를 한눈에 확인하세요">
    <meta property="twitter:image" content="https://251113-01.vercel.app/og-image.png">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <!-- Chart.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>ETF 시세 조회</h1>
            <p class="subtitle">실시간 ETF 가격 및 일별 시세 정보</p>
        </header>

        <!-- Search Section -->
        <section class="search-section">
            <div class="search-box">
                <input
                    type="text"
                    id="etf-code-input"
                    placeholder="ETF 종목코드 입력 (예: 152100)"
                    class="search-input"
                >
                <button id="search-btn" class="search-btn">검색</button>
            </div>
            <div id="search-error" class="error-message" style="display: none;"></div>
        </section>

        <!-- ETF Basic Info Section -->
        <section id="etf-info-section" class="etf-info-section" style="display: none;">
            <h2>ETF 기본 정보</h2>
            <div class="info-card">
                <div class="info-header">
                    <h3 id="etf-name" class="etf-name">-</h3>
                    <span id="etf-code" class="etf-code">-</span>
                </div>
                <div class="info-grid">
                    <div class="info-item">
                        <span class="info-label">현재가</span>
                        <span id="current-price" class="info-value price-large">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">전일대비</span>
                        <span id="price-change" class="info-value">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">등락률</span>
                        <span id="change-percent" class="info-value">-</span>
                    </div>
                </div>
                <div class="info-grid secondary">
                    <div class="info-item">
                        <span class="info-label">시가</span>
                        <span id="open-price" class="info-value">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">고가</span>
                        <span id="high-price" class="info-value">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">저가</span>
                        <span id="low-price" class="info-value">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">거래량</span>
                        <span id="volume" class="info-value">-</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Intraday Price Section -->
        <section id="intraday-section" class="data-section" style="display: none;">
            <div class="section-header">
                <h2>시간대별 시세</h2>
                <span class="update-time" id="intraday-update">-</span>
            </div>
            <div class="chart-container">
                <canvas id="intraday-chart"></canvas>
            </div>
        </section>

        <!-- Daily Price Section -->
        <section id="daily-section" class="data-section" style="display: none;">
            <div class="section-header">
                <h2>일별 시세 (30일)</h2>
            </div>
            <div class="chart-container">
                <canvas id="daily-chart"></canvas>
            </div>
        </section>

        <!-- Loading Spinner -->
        <div id="loading-spinner" class="loading-spinner" style="display: none;">
            <div class="spinner"></div>
            <p>데이터를 불러오는 중...</p>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2025 ETF 시세 조회. 데이터 출처: 공공데이터포털</p>
            <p class="disclaimer">본 정보는 투자 참고용이며, 투자 판단의 책임은 투자자에게 있습니다.</p>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
